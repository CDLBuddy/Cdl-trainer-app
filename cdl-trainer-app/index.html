<!-- public/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="color-scheme" content="dark light" />
    <!-- Prefer dual theme-color for light/dark -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b5a6e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0e1b1b" />
    <meta name="application-name" content="CDL Trainer" />
    <meta name="apple-mobile-web-app-title" content="CDL Trainer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />

    <!-- Favicons / App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#004d66" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Optional: Preconnects (Firebase/Google) -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
   <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>

    <!-- SEO -->
    <title>CDL Trainer App</title>
    <meta name="description" content="CDL Trainer App - Modern digital platform for CDL students, instructors, and school admins. ELDT, practice, walkthrough, compliance, and more." />

    <!-- Open Graph -->
    <meta property="og:title" content="CDL Trainer App" />
    <meta property="og:description" content="Digital CDL training and compliance for schools and students." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CDL Trainer App" />
    <meta name="twitter:description" content="Digital CDL training and compliance for schools and students." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- (Optional) Robots: keep out of search in non-prod -->
    <!-- <meta name="robots" content="noindex,nofollow"> -->

    <!-- Optional CSP (tighten as needed; add your exact Firebase endpoints) -->
    <!--
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        img-src 'self' https: data: blob:;
        style-src 'self' 'unsafe-inline';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        font-src 'self' https: data:;
        connect-src 'self' https: https://firestore.googleapis.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
        base-uri 'self';
        form-action 'self';
      ">
    -->
  </head>

  <body style="background:#0e1b1b">
    <noscript>
      <div style="padding:1rem;color:#fff;text-align:center">
        This app needs JavaScript enabled.
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
